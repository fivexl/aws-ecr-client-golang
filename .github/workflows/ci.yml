name: CI

on:
  push:
    tags: [ v* ]
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write # goreleaser publishes the GitHub release
  id-token: write # OIDC role for the release upload

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

    - name: Prepare a snapshot release
      if: "!startsWith(github.ref, 'refs/tags/v')"
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release a new version
      if: startsWith(github.ref, 'refs/tags/v')
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure AWS credentials
      if: startsWith(github.ref, 'refs/tags/v')
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Upload Artifacts to releases.fivexl.io
      if: startsWith(github.ref, 'refs/tags/v')
      run: aws s3 sync ./dist/ s3://${{ secrets.RELEASE_BUCKET }}/aws-ecr-client-golang/${{ github.ref_name }}/ --exclude "*" --include "*.zip" --include "checksums.txt"
